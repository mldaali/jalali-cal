<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تقویم فارسی</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-dashboard">
    <!-- Main Hero Date Card with Embedded Minimalist Corner Actions -->
    <section class="hero-date-card" id="heroCard">
      <!-- Subtle Borderless Corner Actions -->
      <div class="corner-actions">
        <button class="corner-icon-btn" id="themeToggleBtn" title="تغییر پوسته" aria-label="تغییر پوسته">
          <span id="themeIcon">☀️</span>
        </button>
        <button class="corner-icon-btn" id="refreshBtn" title="به‌روزرسانی" aria-label="به‌روزرسانی">
          <svg class="refresh-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
          </svg>
        </button>
      </div>

      <!-- Main Solar Date (Click-to-Copy) -->
      <div class="solar-date-row clickable-copy" id="heroSolarDate" title="کلیک برای کپی تاریخ خورشیدی">
        <span class="solar-weekday" id="heroWeekday">...</span>
        <div class="solar-day-group">
          <span class="solar-day-num" id="heroDayNum">--</span>
          <span class="solar-month-year" id="heroMonthYear">...</span>
        </div>
      </div>

      <!-- Secondary Sub-dates: Gregorian (Click-to-Copy) & Lunar Hijri -->
      <div class="sub-dates-row">
        <span class="sub-gregorian clickable-copy" id="heroGregorian" title="کلیک برای کپی تاریخ میلادی">--</span>
        <span class="sub-sep">•</span>
        <span class="sub-islamic" id="heroIslamic">--</span>
      </div>

      <!-- Brief Click-to-Copy Tooltip -->
      <div class="copy-toast" id="copyToast">کپی شد!</div>
    </section>

    <!-- Conditional Occasion / Holiday Badge (Hidden if no events) -->
    <div class="occasion-container hidden" id="occasionContainer">
      <div class="occasion-badge" id="occasionBadge">
        <span class="badge-dot" id="badgeDot"></span>
        <span class="badge-text" id="badgeText"></span>
      </div>
    </div>

    <!-- Calendar Month Navigation Bar -->
    <div class="calendar-nav-bar">
      <button class="nav-arrow" id="prevMonthBtn" title="ماه قبل" aria-label="ماه قبل">›</button>
      <div class="month-title-wrapper">
        <span class="month-title" id="monthTitle">...</span>
        <button class="jump-today-btn" id="jumpTodayBtn" title="بازگشت به امروز">امروز</button>
      </div>
      <button class="nav-arrow" id="nextMonthBtn" title="ماه بعد" aria-label="ماه بعد">‹</button>
    </div>

    <!-- Calendar Matrix Grid -->
    <div class="calendar-matrix-card">
      <div class="weekdays-row">
        <div class="weekday-cell">ش</div>
        <div class="weekday-cell">ی</div>
        <div class="weekday-cell">د</div>
        <div class="weekday-cell">س</div>
        <div class="weekday-cell">چ</div>
        <div class="weekday-cell">پ</div>
        <div class="weekday-cell friday-col">ج</div>
      </div>
      <div class="days-matrix" id="daysMatrix"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="events.js"></script>
  <script src="popup.js"></script>
</body>
</html>
