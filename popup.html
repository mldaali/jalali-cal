<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تقویم فارسی</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-dashboard">
    <!-- Top Bar: Title & Theme & Clock -->
    <header class="top-bar">
      <div class="brand-group">
        <img src="icons/icon-32.png" alt="تقویم" class="brand-icon">
        <span class="brand-name">تقویم فارسی</span>
      </div>
      <div class="top-actions">
        <div class="live-clock" id="liveClock" title="ساعت زنده">--:--:--</div>
        <button class="icon-btn" id="themeToggleBtn" title="تغییر پوسته" aria-label="تغییر پوسته">
          <span id="themeIcon">☀️</span>
        </button>
      </div>
    </header>

    <!-- Prominent Today Hero Section -->
    <section class="hero-date-section" id="heroSection">
      <div class="hero-main-row">
        <span class="hero-weekday" id="heroWeekday">...</span>
        <div class="hero-date-wrapper">
          <span class="hero-day-num" id="heroDayNum">--</span>
          <span class="hero-month-year" id="heroMonthYear">...</span>
        </div>
      </div>
      <div class="hero-sub-dates" id="heroSubDates">
        <span id="heroGregorian">--</span>
        <span class="dot-separator">•</span>
        <span id="heroIslamic">--</span>
      </div>
    </section>

    <!-- Scroll-Free Occasion / Holiday Pill -->
    <div class="occasion-pill-wrapper">
      <div class="occasion-pill" id="occasionPill">
        <span class="occasion-indicator-dot" id="occasionDot"></span>
        <span class="occasion-text" id="occasionText">در حال بارگذاری...</span>
      </div>
    </div>

    <!-- Calendar Month Navigation -->
    <div class="calendar-header-bar">
      <button class="nav-arrow-btn" id="prevMonthBtn" title="ماه قبل" aria-label="ماه قبل">›</button>
      <div class="month-title-group">
        <span class="month-title" id="monthTitle">...</span>
        <button class="jump-today-dot" id="jumpTodayBtn" title="بازگشت به امروز">امروز</button>
      </div>
      <button class="nav-arrow-btn" id="nextMonthBtn" title="ماه بعد" aria-label="ماه بعد">‹</button>
    </div>

    <!-- Calendar Grid (Compact single-screen) -->
    <div class="calendar-container">
      <div class="weekdays-row">
        <div class="col-header">ش</div>
        <div class="col-header">ی</div>
        <div class="col-header">د</div>
        <div class="col-header">س</div>
        <div class="col-header">چ</div>
        <div class="col-header">پ</div>
        <div class="col-header friday">ج</div>
      </div>
      <div class="days-matrix" id="daysMatrix"></div>
    </div>

    <!-- Compact Minimalist Footer: Status & Refresh -->
    <footer class="app-footer">
      <div class="status-indicator" title="وضعیت افزونه">
        <span class="pulse-dot"></span>
        <span class="status-label" id="statusLabel">۱۴۰۵ خورشیدی</span>
      </div>
      <div class="footer-actions">
        <button class="refresh-btn" id="refreshBtn" title="به‌روزرسانی سریع" aria-label="به‌روزرسانی">
          <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="events.js"></script>
  <script src="popup.js"></script>
</body>
</html>
