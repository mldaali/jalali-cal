<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تقویم فارسی</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-dashboard">
    <!-- Main Hero Date Card with Embedded Minimalist Corner Actions -->
    <section class="hero-date-card" id="heroCard">
      <!-- Right Corner Action: Theme Toggle Button -->
      <div class="corner-actions corner-right">
        <button class="corner-icon-btn" id="themeToggleBtn" title="پوسته: خودکار بر اساس سیستم" aria-label="تغییر پوسته">
          <span id="themeIcon">🌓</span>
        </button>
      </div>

      <!-- Left Corner Actions: Quick Note & Refresh -->
      <div class="corner-actions corner-left">
        <button class="corner-icon-btn" id="quickNoteBtn" title="ثبت یادداشت برای روز انتخابی (کلید N)" aria-label="یادداشت">
          <svg class="note-svg" id="quickNoteIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
        </button>
        <button class="corner-icon-btn" id="refreshBtn" title="به‌روزرسانی" aria-label="به‌روزرسانی">
          <svg class="refresh-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
          </svg>
        </button>
      </div>

      <!-- Main Solar Date (Click-to-Copy) -->
      <div class="solar-date-row clickable-copy" id="heroSolarDate" title="کلیک برای کپی تاریخ خورشیدی (کلید C)">
        <span class="solar-weekday" id="heroWeekday">...</span>
        <div class="solar-day-group">
          <span class="solar-day-num" id="heroDayNum">--</span>
          <span class="solar-month-year" id="heroMonthYear">...</span>
        </div>
      </div>

      <!-- Secondary Sub-dates: Gregorian (Click-to-Copy) & Lunar Hijri -->
      <div class="sub-dates-row">
        <span class="sub-gregorian clickable-copy" id="heroGregorian" title="کلیک برای کپی تاریخ میلادی">--</span>
        <span class="sub-sep">•</span>
        <span class="sub-islamic" id="heroIslamic">--</span>
      </div>

      <!-- Brief Click-to-Copy Tooltip -->
      <div class="copy-toast" id="copyToast">کپی شد!</div>
    </section>

    <!-- Unified Zero-Jitter Status Strip (Fixed 24px height slot prevents UI jump) -->
    <div class="day-status-slot" id="dayStatusSlot">
      <!-- Occasion / Holiday Badge -->
      <div class="occasion-container" id="occasionContainer">
        <div class="occasion-badge hidden" id="occasionBadge">
          <span class="badge-dot" id="badgeDot"></span>
          <span class="badge-text" id="badgeText"></span>
        </div>
      </div>

      <!-- Personal Local Note View -->
      <div class="note-section" id="noteSection">
        <div class="note-pill hidden" id="notePill">
          <span class="note-icon">📌</span>
          <span class="note-text" id="noteText" title="برای ویرایش کلیک کنید"></span>
          <button class="note-action-btn" id="delNoteBtn" title="حذف یادداشت" aria-label="حذف یادداشت">✕</button>
        </div>

        <!-- Inline Note Input Form -->
        <div class="note-editor hidden" id="noteEditor">
          <input type="text" id="noteInput" class="note-input" maxlength="70" placeholder="یادداشت برای این روز..." autocomplete="off" />
          <div class="note-editor-btns">
            <button id="saveNoteBtn" class="note-btn save-btn">ثبت</button>
            <button id="cancelNoteBtn" class="note-btn cancel-btn">لغو</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Calendar Month Navigation Bar -->
    <div class="calendar-nav-bar">
      <!-- Right Side in RTL: Next Month (› / >) -->
      <button class="nav-arrow" id="nextMonthBtn" title="ماه بعد (M / PageDown)" aria-label="ماه بعد">
        <svg class="nav-arrow-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
      <div class="month-title-wrapper">
        <span class="month-title" id="monthTitle" title="مشاهده رویدادهای ماه (یا کلید E را نگه دارید)">...</span>
        <button class="jump-today-btn" id="jumpTodayBtn" title="بازگشت به امروز (T)">امروز</button>
      </div>
      <!-- Left Side in RTL: Previous Month (‹ / <) -->
      <button class="nav-arrow" id="prevMonthBtn" title="ماه قبل (P / PageUp)" aria-label="ماه قبل">
        <svg class="nav-arrow-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
    </div>

    <!-- Calendar Matrix Grid -->
    <div class="calendar-matrix-card">
      <div class="weekdays-row">
        <div class="weekday-cell">ش</div>
        <div class="weekday-cell">ی</div>
        <div class="weekday-cell">د</div>
        <div class="weekday-cell">س</div>
        <div class="weekday-cell">چ</div>
        <div class="weekday-cell">پ</div>
        <div class="weekday-cell friday-col">ج</div>
      </div>
      <div class="days-matrix" id="daysMatrix"></div>
    </div>

    <!-- Minimalist Shortcut Footer Guide (E N T D C) -->
    <div class="shortcuts-footer" title="کلیدهای میانبر: E رویدادها • N یادداشت • T امروز • D پوسته • C کپی">
      <span>⌨ E رویدادها • N یادداشت • T امروز • D پوسته • C کپی</span>
    </div>

    <!-- Month Events HUD Peek Overlay (Hold key 'E' to show) -->
    <div class="month-events-overlay hidden" id="monthEventsOverlay" aria-hidden="true">
      <div class="events-overlay-card">
        <div class="events-overlay-header">
          <div class="events-header-title-group">
            <span class="events-header-icon">📅</span>
            <span class="events-header-title" id="eventsOverlayTitle">رویدادهای ماه</span>
          </div>
          <span class="events-overlay-hint">رها کردن E: بستن</span>
          <button class="events-overlay-close-btn" id="closeEventsOverlayBtn" title="بستن (Escape)" aria-label="بستن">✕</button>
        </div>
        <div class="events-overlay-list" id="eventsOverlayList"></div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="events.js"></script>
  <script src="popup.js"></script>
</body>
</html>
